<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
   "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Pendaftaran Kegiatan</h1>
    <form action="" method="post">
        
        <h2>Data Pendaftar</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;"><strong>Nama Lengkap</strong></td>
                <td><input type="text" name="namalengkap" /></td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>NIM</strong></td>
                <td><input type="text" name="nim" /></td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Program Studi</strong></td>
                <td>
                    <select name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Jenis Kelamin</strong></td>
                <td>
                    <input type="radio" id="lakilaki" name="jk" value="Laki-laki" />
                    <label for="lakilaki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
        </table>

        <h2>Pilihan Kegiatan</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;"><strong>Jenis Kegiatan</strong></td>
                <td>
                    <input type="radio" id="seminar" name="jeniskegiatan" value="Seminar" />
                    <label for="seminar">Seminar</label>
                    <input type="radio" id="pelatihan" name="jeniskegiatan" value="Pelatihan" />
                    <label for="pelatihan">Pelatihan</label>
                    <input type="radio" id="diskusi" name="jeniskegiatan" value="Diskusi" />
                    <label for="diskusi">Diskusi</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Bidang Minat</strong></td>
                <td>
                    <p><input type="checkbox" id="teknologi" name="minat" value="Teknologi" /> <label for="teknologi">Teknologi</label></p>
                    <p><input type="checkbox" id="organisasi" name="minat" value="Organisasi" /> <label for="organisasi">Organisasi</label></p>
                    <p><input type="checkbox" id="karier" name="minat" value="Karier" /> <label for="karier">Karier</label></p>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Waktu Kegiatan</strong></td>
                <td>
                    <select name="waktu">
                        <option>Pagi</option>
                        <option>Siang</option>
                        <option>Sore</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Kelengkapan Pendaftaran</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;"><strong>Harapan Mengikuti Kegiatan</strong></td>
                <td><textarea name="harapan" rows="5" cols="40"></textarea></td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Bukti Pembayaran</strong></td>
                <td><input type="file" name="buktipembayaran" /></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Kirim" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
